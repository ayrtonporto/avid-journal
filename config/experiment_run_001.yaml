  target_theorem: '\label{thm:spectral_lowerbound}

    The eigenvalues $\lambda_i\neq 1$ of a finite, irreducible Markov chain satisfy

    $$d(n) \le \max_{i\ge 2} |\lambda_i|$$

    where $d(n)$ is the total variation distance.

    '
  known_duplicator: desconocido — posiblemente ya conocido en literatura de mixing
    times (LPW?)
  confirmed: true
  withdrawal_comment: This paper has been withdrawn because I have been made aware
    that the result was previously known
