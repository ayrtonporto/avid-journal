  target_theorem: 'Let $R$ be a set of rectangles such that the largest independent
    set

    is of size $m$, then the rectangles can be sliced by at most

    $O(m \log m)$ lines.

    '
  known_duplicator: Gyárfás & Lehel (1970) — d-separated interval piercing
  confirmed: true
  withdrawal_comment: Withdrawn, because we found out that most of the results were
