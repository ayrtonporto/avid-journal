  # decisión 2026-07-13: target re-apuntado de SquaresZn (fondo, atribuido a [HJL])
  # a EvenPowers (contribución propia duplicada) — ver docs/prior_art_1404.md y
  # docs/paper1_retarget.md
  target_theorem: '\label{EvenPowers}

    $\mathbb{Z}_n$ can be covered by fifteen quartics, nine sextics,
    thirty-two octics, and twelve decics, and these are all best possible.
    That is, for all $n \geq 2$, we have
    \[
    \mathbb{Z}_n \subset 15 R_4, \mathbb{Z}_n \subset 9R_6,
    \mathbb{Z}_n \subset 32R_8, \text{ and } \mathbb{Z}_n \subset 12R_{10}.
    \]
    Furthermore,
    \begin{enumerate}
    \item \label{five4ths} $\mathbb{Z}_n \subset 5R_4$ if and only if
      $8 \nmid n$.
    \item \label{seven4ths} $\mathbb{Z}_n \subset 7R_4$ if and only if
      $16 \nmid n$.
    \end{enumerate}

    '
  known_duplicator: Hardy & Littlewood, Partitio Numerorum VIII — γ(4)=15 por
    método analítico; el retirado lo reproduce con métodos elementales
  confirmed: true
  withdrawal_comment: Paper withdrawn as main results are not original. Main results
    originally proved in 'Some Problems of Partitio Numerorum (VIII)' by G.H. Hardy
    and J.E. Littlewood.
