description: 'Primera corrida del experimento de papers retirados. 5 retirados con
  ground truth NOT-NOVEL + 5 controles emparejados. Objetivo: smoke test de la cañería
  completa (formalización → D1 → D2 → D3).

  '
papers:
- arxiv_id: 1609.02090v1
  role: retracted
  paired_with: null
  # decisión 2026-07-13: target re-apuntado de SquaresZn (fondo, atribuido a [HJL])
  # a EvenPowers (contribución propia duplicada) — ver docs/prior_art_1404.md y
  # docs/paper1_retarget.md
  target_theorem: '\label{EvenPowers}

    $\mathbb{Z}_n$ can be covered by fifteen quartics, nine sextics,
    thirty-two octics, and twelve decics, and these are all best possible.
    That is, for all $n \geq 2$, we have
    \[
    \mathbb{Z}_n \subset 15 R_4, \mathbb{Z}_n \subset 9R_6,
    \mathbb{Z}_n \subset 32R_8, \text{ and } \mathbb{Z}_n \subset 12R_{10}.
    \]
    Furthermore,
    \begin{enumerate}
    \item \label{five4ths} $\mathbb{Z}_n \subset 5R_4$ if and only if
      $8 \nmid n$.
    \item \label{seven4ths} $\mathbb{Z}_n \subset 7R_4$ if and only if
      $16 \nmid n$.
    \end{enumerate}

    '
  known_duplicator: Hardy & Littlewood, Partitio Numerorum VIII — γ(4)=15 por
    método analítico; el retirado lo reproduce con métodos elementales
  confirmed: true
  withdrawal_comment: Paper withdrawn as main results are not original. Main results
    originally proved in 'Some Problems of Partitio Numerorum (VIII)' by G.H. Hardy
    and J.E. Littlewood.
- arxiv_id: 1207.0631v1
  role: retracted
  paired_with: null
  target_theorem: '\label{maintheo}

    Let $A$ be a non-scalar matrix of $\Mat_n(\K)$, and $c_1,\dots,c_n$ be scalars.
    Then the following conditions are equivalent:
    \begin{enumerate}[(i)]
    \item $c_1+\cdots+c_n=\tr A$;
    \item $A$ is similar to a matrix with diagonal entries $c_1,\dots,c_n$.
    \end{enumerate}

    '
  # decisión 2026-07-12: objetivo = maintheo (el "resultado" del comentario de retiro; conexión Fillmore)
  known_duplicator: Result already published with similar proof (Fillmore, 1969?)
  confirmed: true
  withdrawal_comment: withdrawn since the result has already been published with a
    similar proof
- arxiv_id: 1212.0196v1
  role: retracted
  paired_with: null
  target_theorem: '\label{cor:main}

    Suppose $m=p_1\cdots p_k$ and $p_i\equiv 3\pmod 8$.

    If $\leg{p_i}{p_j}=1$ for all $1\leq i<j\leq k$,

    then $m$ is a non-congruent number.

    '
  # decisión 2026-07-12: extensiones a 2m y conjunto S excluidas del objetivo
  known_duplicator: Monsky (well-known result on congruent numbers)
  confirmed: true
  withdrawal_comment: This paper has been withdrawn by the author because it is a
    corollary of a well-known result by Monsky
