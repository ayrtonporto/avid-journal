# D3 Validation Pairs
# ====================
# Cada entrada define un par de pruebas a comparar con compute_d3.
#
# Tipos de pares:
#   genuinely_different  — mismo teorema, estrategias de prueba distintas (debería dar ≈ 0.5–1.0)
#   same_disguised       — misma estrategia con cambios cosméticos (debería dar ≈ 0.0–0.2)
#   control_self         — la misma prueba comparada consigo misma (debería dar ≈ 0.0)
#   control_unrelated    — teoremas sin relación (debería dar ≈ 1.0)
#
# Campos:
#   pair_id              — identificador único del par (ej. "T08_E1_E2")
#   type                 — uno de los tipos arriba
#   proof_a / proof_b    — cada prueba se identifica por:
#     ast_json           — ruta al archivo ast.json (relativa a repo root)
#     theorem_lines      — [start, end] líneas del teorema en el archivo fuente
#     statement_lines    — [start, end] líneas SOLO del enunciado (para Filtro 2)

pairs:
  # ── T08: √2 irrational (E1: parity-proof, E2: valuation-proof) ──────
  - pair_id: "T08_E1_E2"
    type: "genuinely_different"
    proof_a:
      ast_json: "lean_project/.lake/build/ir/Papers/D3_Calibration/Paper.ast.json"
      theorem_lines: [42, 91]
      statement_lines: [42, 42]
    proof_b:
      ast_json: "lean_project/.lake/build/ir/Papers/D3_Calibration/Paper.ast.json"
      theorem_lines: [100, 158]
      statement_lines: [100, 100]

  # ── T09: Sum 1+…+n = n(n+1)/2 (induction vs gauss pairing) ─────────
  - pair_id: "T09_induction_vs_gauss"
    type: "genuinely_different"
    proof_a:
      ast_json: "lean_project/.lake/build/ir/Papers/D3_Calibration/Paper.ast.json"
      theorem_lines: [168, 193]
      statement_lines: [168, 168]
    proof_b:
      ast_json: "lean_project/.lake/build/ir/Papers/D3_Calibration/Paper.ast.json"
      theorem_lines: [197, 202]
      statement_lines: [197, 197]

  # ── T07: Infinite primes (same proof, limited by both using same lemma) ──
  - pair_id: "T07_euclid_vs_factorial"
    type: "same_disguised"
    proof_a:
      ast_json: "lean_project/.lake/build/ir/Papers/D3_Calibration/Paper.ast.json"
      theorem_lines: [25, 26]
      statement_lines: [25, 25]
    proof_b:
      ast_json: "lean_project/.lake/build/ir/Papers/D3_Calibration/Paper.ast.json"
      theorem_lines: [28, 30]
      statement_lines: [28, 28]

  # ── CONTROL SELF: T08a vs sí misma ──────────────────────────────────
  - pair_id: "control_self_T08a"
    type: "control_self"
    proof_a:
      ast_json: "lean_project/.lake/build/ir/Papers/D3_Calibration/Paper.ast.json"
      theorem_lines: [42, 91]
      statement_lines: [42, 42]
    proof_b:
      ast_json: "lean_project/.lake/build/ir/Papers/D3_Calibration/Paper.ast.json"
      theorem_lines: [42, 91]
      statement_lines: [42, 42]

  # ── CONTROL UNRELATED: T07 vs T08 ───────────────────────────────────
  - pair_id: "control_unrelated_T07xT08"
    type: "control_unrelated"
    proof_a:
      ast_json: "lean_project/.lake/build/ir/Papers/D3_Calibration/Paper.ast.json"
      theorem_lines: [25, 26]
      statement_lines: [25, 25]
    proof_b:
      ast_json: "lean_project/.lake/build/ir/Papers/D3_Calibration/Paper.ast.json"
      theorem_lines: [42, 91]
      statement_lines: [42, 42]
