# AViD Journal — Demo deployment
#
# Usage:
#   docker compose up -d          # start detached
#   docker compose logs -f        # follow logs
#   docker compose down           # stop
#
# Secrets: copy .env.example to .env and fill in OPENCODE_GO_API_KEY

version: "3.9"

services:
  avid-demo:
    build: .
    image: avid-journal:latest
    container_name: avid-demo
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - GRADIO_SERVER_NAME=0.0.0.0
    # Mount cache dir to persist MiniLM downloads across restarts
    volumes:
      - avid_cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  avid_cache:
